<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 70" role="img" aria-label="Aggron — Inteligência que gera valor">
  <!--
    Logo Aggron — versao horizontal placeholder.
    Inspirada no manual oficial: monograma A geometrico verde Aggron + ouro,
    wordmark em Sora bold espaco entre letras 0.15em. Substituir pelo SVG
    final do designer quando chegar — manter mesma viewBox pra nao quebrar
    layout do header.
    Cores: --brand-verde-claro #166B3D, --brand-ouro #D4AF37, branco #E6E6E6.
  -->
  <g transform="translate(8 8)">
    <!-- Triangulo externo verde -->
    <path d="M27 0 L54 54 L0 54 Z" fill="#166B3D"/>
    <!-- Faixa dourada angular -->
    <path d="M22 22 L40 38 L34 38 L19 26 Z" fill="#D4AF37"/>
    <!-- "Vazio" interno preto pra dar profundidade ao monograma -->
    <path d="M27 14 L46 50 L8 50 Z" fill="#0F2A1F"/>
    <!-- A interno mais claro -->
    <path d="M27 22 L42 50 L12 50 Z" fill="#166B3D"/>
    <!-- Faixa dourada dentro do A -->
    <rect x="18" y="38" width="18" height="3" fill="#D4AF37"/>
  </g>
  <!-- Wordmark AGGRON -->
  <text x="78" y="42" font-family="Sora, system-ui, sans-serif"
        font-weight="700" font-size="28"
        letter-spacing="3" fill="#E6E6E6">AGGRON</text>
  <!-- Tagline pequena -->
  <text x="80" y="58" font-family="Inter, system-ui, sans-serif"
        font-weight="500" font-size="8"
        letter-spacing="1.4" fill="#D4AF37">INTELIG&#202;NCIA QUE GERA VALOR</text>
</svg>
