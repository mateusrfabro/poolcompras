<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 70" role="img" aria-label="Aggron — Inteligência que gera valor">
  <!--
    Logo Aggron horizontal — fiel ao manual de identidade oficial 2026.
    Monograma A (mesma estrutura do logo-aggron-symbol.svg) + wordmark
    Sora bold + tagline Inter ouro. Use em OG image, e-mails, documentos.
    Cores: Verde Aggron #0F2A1F, Verde Claro #166B3D, Ouro #D4AF37,
    Cinza Claro #E6E6E6.
  -->
  <g transform="translate(8 5)">
    <!-- 1. Silhueta principal Verde Aggron -->
    <path d="M30 2 L58 56 L2 56 Z" fill="#0F2A1F"/>
    <!-- 2. Borda iluminada Verde Claro -->
    <path d="M30 7 L53 54 L7 54 Z" fill="#166B3D"/>
    <!-- 3. Recorte interior Verde Aggron -->
    <path d="M30 13 L48 52 L12 52 Z" fill="#0F2A1F"/>
    <!-- 4. Corpo Verde Claro -->
    <path d="M30 22 L43 50 L17 50 Z" fill="#166B3D"/>
    <!-- 5. Faixa dourada angular — assinatura visual -->
    <path d="M17 44 L40 29 L43 33 L20 49 Z" fill="#D4AF37"/>
  </g>
  <!-- Wordmark AGGRON -->
  <text x="78" y="40" font-family="Sora, system-ui, sans-serif"
        font-weight="700" font-size="28"
        letter-spacing="4" fill="#E6E6E6">AGGRON</text>
  <!-- Tagline oficial -->
  <text x="80" y="56" font-family="Inter, system-ui, sans-serif"
        font-weight="500" font-size="8"
        letter-spacing="1.6" fill="#D4AF37">INTELIG&#202;NCIA QUE GERA VALOR</text>
</svg>
