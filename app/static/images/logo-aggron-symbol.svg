<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Aggron">
  <!--
    Monograma A geometrico Aggron — versao simplificada (3 camadas) pra
    legibilidade em escala pequena (favicon, navbar 40px). Mantém conceito
    do briefing: triangulo verde + barra dourada + vazio escuro.
  -->
  <!-- Silhueta principal: triangulo verde Aggron claro (forma do A) -->
  <path d="M32 4 L60 60 L4 60 Z" fill="#166B3D"/>
  <!-- "Vazio" interno do A — verde escuro Aggron (sem retangulo de fundo) -->
  <path d="M32 20 L50 54 L14 54 Z" fill="#0F2A1F"/>
  <!-- Travessa horizontal (barra do A) — dourado Aggron -->
  <rect x="18" y="42" width="28" height="5" fill="#D4AF37"/>
</svg>
